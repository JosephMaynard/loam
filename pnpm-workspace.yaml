packages:
  - apps/*
  - packages/*

# Shared dev/build tooling versions live here once, and every workspace package references them with
# `"<dep>": "catalog:"`. This guarantees the versions stay aligned across the workspace — bump a tool
# in one place instead of hunting through eight package.json files (and no more silent drift like the
# esbuild 0.25-vs-0.28 split this replaced). Only deps used by 2+ packages belong here; single-package
# deps stay in their own manifest.
catalog:
  "@preact/preset-vite": ^2.10.6
  "@types/node": ^24.13.6
  esbuild: ^0.28.2
  jsdom: ^30.1.1
  preact: ^10.29.8
  tsx: ^4.23.15
  typescript: ~7.0.2
  vite: ^8.3.0
  vitest: ^5.0.2

onlyBuiltDependencies:
  - better-sqlite3-multiple-ciphers
  - esbuild
  # llama.rn ships no native libs in its npm tarball — it downloads the prebuilt librnllama*.so via a
  # postinstall script. Without this allow-list entry pnpm skips that script, the Android build finds no
  # prebuilt libs, gradle silently produces NO librnllama_jni.so, and the on-device LLM fails at runtime
  # with "JSI bindings not installed". (build-apk.mjs also runs the downloader explicitly as a backstop.)
  - llama.rn

# Wait a day before installing a newly published version: most malicious releases are caught and
# pulled within hours. Applies when pnpm resolves (pnpm add / update, Dependabot); a frozen-lockfile
# install only fetches what the lockfile already names.
minimumReleaseAge: 1440

# `pnpm audit --prod --audit-level=high` runs in CI. These advisories have no patched release and reach
# LOAM only through Expo build tooling (`expo` > `@expo/cli`), which runs on the build machine and is not
# bundled into the APK or the server. Remove each entry once a fixed version exists.
auditConfig:
  ignoreGhsas:
    # node-forge <=1.4.0: RSA PKCS#1 v1.5 signature verification accepts extra nested DigestAlgorithm
    # elements. Path: expo > @expo/cli > node-forge (dev-server certificates, not used by LOAM at runtime).
    - GHSA-86w9-cpqp-85rv
    # braces <=3.0.3: stack exhaustion on deeply nested patterns. Path: expo > @expo/cli >
    # @expo/metro-file-map > micromatch > braces (Metro file watching at build time, fixed patterns).
    - GHSA-vfj7-8cjw-p6xm
