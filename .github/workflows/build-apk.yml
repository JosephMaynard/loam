name: Build APK

# Builds the Android host APK and, on a release tag, attaches it to the GitHub Release.
#
# Triggers:
#   - push of a tag matching v*  → verify + test + build (release-signed, REQUIRED) → attach the APK to the
#                                  Release; the Play AAB is built in the same pass and uploaded as a workflow
#                                  artifact only (docs/30 B1 — it's for the Play Console, not the Release).
#                                  Tags are vX.Y.Z, or vX.Y.Z-rc.N / vX.Y.Z-beta.N for a pre-release: same
#                                  checks, keystore and tests, AAB included (RCs are what internal testing
#                                  gets), but published as a GitHub PRE-release. Anything else fails the
#                                  version check.
#   - manual (workflow_dispatch) → build + upload the APK as a workflow artifact (no Release); debug-signed
#                                  when the keystore secret isn't configured
#
# The heavy lifting is scripts/build-apk.mjs (`pnpm --filter app apk`): it runs the workspace build,
# fetches the SQLite native prebuilds (fetch:native), bundles the embedded server, downloads llama.rn's
# native libs, runs `expo prebuild --clean`, and assembles the release APK for arm64-v8a. The build job
# only provides the toolchain (JDK + Android SDK/NDK/CMake) and the signing key.
#
# Hardening (pre-release review 2026-09-25):
#   - Every action is pinned to a full commit SHA (the version is in the trailing comment).
#   - The build job has read-only repo access and checks out without persisting the token; only the small
#     `release` job gets `contents: write`, and it runs no repo code: it downloads the built artifact and
#     attaches it with its SHA-256 checksum (`loam-host.apk.sha256`).
#   - On a tag, the `attest` job (the only one with `id-token: write` + `attestations: write`) records signed
#     build provenance for the APK and the AAB. Check a download with
#     `gh attestation verify loam-host.apk --repo MagicZebraLtd/loam`, or the checksum with
#     `sha256sum -c loam-host.apk.sha256`.
#   - The keystore secrets are exposed ONLY to the one step that writes the keystore, never job-wide.
#   - Tag builds FAIL without the keystore secret (a debug-signed release can't update installs), when the
#     tag's X.Y.Z doesn't match the manifest versions, or when versionCode isn't above that of every earlier
#     release tag (pre-releases included — Play never accepts a code twice).
#     `pnpm test` must pass before anything is built.
#
# NOTE: for this to fire on a tag, the workflow file must already exist in the tagged commit — i.e. it
# must be merged to master before you push a v* tag built from master.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android host APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history + tags: the release-version check compares versionCode with the previous tag.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Check versions
        # On a tag: the tag's X.Y.Z (before any -rc.N / -beta.N) must equal the manifest version and
        # versionCode must exceed every earlier release tag's. Otherwise: every manifest agrees.
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            node scripts/check-versions.mjs --release-tag "$RELEASE_TAG"
          else
            node scripts/check-versions.mjs
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: pnpm test

      - name: Android host typecheck
        run: pnpm --filter app typecheck

      - name: Setup JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Only platform-tools is needed here; the NDK, CMake, build tools and platforms come from the
          # sdkmanager step below and from Gradle. v4's default is already this; it's spelled out because v3's
          # default ("tools platform-tools") broke the v0.5.0 tag build (2026-09-28) once Google removed the
          # legacy `tools` package ("Failed to find package 'tools'").
          packages: platform-tools

      - name: Install NDK + CMake
        # NDK 27.1.12297006 is the version Expo SDK 57 / RN 0.86 prebuild pins (and what a working local
        # build uses); llama.rn's CMake build links against it. CMake 3.22.1 is the AGP default the RN
        # modules' externalNativeBuild expects.
        run: sdkmanager "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Configure release signing
        # The ONLY step that sees the keystore secrets. Materialises release.jks + keystore.properties, which
        # plugins/with-release-signing.js picks up at prebuild to sign with a STABLE key (so installs update
        # in place). No secret: a tag build fails here; a manual build proceeds debug-signed, acknowledged
        # explicitly (LOAM_ALLOW_DEBUG_SIGNING) so build-apk.mjs doesn't treat it as an accident.
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            if [ "$IS_TAG" = "true" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not set — refusing to publish a debug-signed release APK."
              exit 1
            fi
            echo "::warning::No keystore secret — this manual build is DEBUG-SIGNED (not for distribution)."
            echo "LOAM_ALLOW_DEBUG_SIGNING=1" >> "$GITHUB_ENV"
            exit 0
          fi
          umask 077
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/app/release.jks
          cat > apps/app/keystore.properties <<PROPS
          storeFile=release.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          PROPS

      - name: Build APK (and, on a tag, the AAB)
        # `aab` runs the same pipeline as `apk` (the APK lands at the same path) and then adds a
        # `bundleRelease` pass; it refuses to build without the release keystore, which a tag build has
        # already guaranteed above. LOAM_RELEASE_TAG (tag builds only; empty otherwise) bakes the tag into
        # the build, so an RC's update check knows the final release of its X.Y.Z is newer.
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          LOAM_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          if [ "$IS_TAG" = "true" ]; then
            pnpm --filter app aab
          else
            pnpm --filter app apk
          fi

      - name: Remove signing material
        if: always()
        run: rm -f apps/app/release.jks apps/app/keystore.properties

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loam-host-apk
          path: apps/app/loam-host.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        # Play upload artifact (upload-key signed). Deliberately NOT attached to the GitHub Release: the
        # release job downloads only `loam-host-apk`.
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loam-host-aab
          path: apps/app/loam-host.aab
          if-no-files-found: error

  attest:
    name: Attest build provenance
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # mint the OIDC token Sigstore signs the attestation with
      attestations: write # store the attestation on this repository
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: loam-host-apk

      - name: Download AAB artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: loam-host-aab

      - name: Attest the APK and the AAB
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            loam-host.apk
            loam-host.aab

  release:
    name: Attach APK to the Release
    needs: [build-apk, attest]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create/update the Release and upload the APK asset (this job only)
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: loam-host-apk

      - name: Write the APK checksum
        # `sha256sum -c loam-host.apk.sha256` beside a downloaded APK checks it.
        run: sha256sum loam-host.apk > loam-host.apk.sha256 && cat loam-host.apk.sha256

      - name: Attach APK and checksum to the Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            loam-host.apk
            loam-host.apk.sha256
          fail_on_unmatched_files: true
          # vX.Y.Z-rc.N / -beta.N (check-versions rejects any other suffix) → a GitHub pre-release, so it
          # never becomes "Latest" or the default download.
          prerelease: ${{ contains(github.ref_name, '-') }}
