name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Nothing here pushes; don't leave the token in .git/config for build/test scripts to read.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # Every workspace package.json, cli/package.json and apps/app/app.json expo.version must agree.
      - name: Check versions
        run: node scripts/check-versions.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Every workspace's Vitest suite, then `node --test` over scripts/*.test.mjs (check-versions' tag
      # rules) and cli/test/ (the root package.json `test:scripts`).
      - name: Unit tests
        run: pnpm test

      # apps/app has no build script (Expo), so the recursive build step skips it — typecheck it
      # explicitly or its TypeScript is never validated in CI. It does have a Vitest `test` script
      # (apps/app/vitest.config.ts), which the "Unit tests" step above already runs via `pnpm test`
      # → `pnpm -r --if-present test`.
      - name: Android host typecheck
        run: pnpm --filter app typecheck

      # The workspace suites never run the PUBLISHED CLI. Pack cli/, install the tarball as a user would
      # (catches files missing from `files` and an optional SQLCipher driver that won't install), and
      # drive the installed `loam`: default-port fallback, a taken --port, --encrypt + reopen.
      - name: loamnet package smoke test
        run: pnpm smoke:cli

  cli-min-node:
    # The loamnet package supports Node 22.14+ (its SQLCipher driver needs Node-API 10, and below that it
    # segfaults on load rather than throwing). The main job only runs the packaged CLI on .node-version;
    # this one builds there too, then installs and drives the CLI under the oldest supported Node.
    name: loamnet on Node 22.14
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node (build)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Setup Node 22.14 (run)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0

      - name: loamnet package smoke test (Node 22.14)
        run: node --version && node scripts/cli-smoke.mjs
