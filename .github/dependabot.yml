# Dependabot version updates. See:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/" # pnpm workspace root — covers every apps/* and packages/* manifest
    schedule:
      interval: "weekly"
    # Batch routine minor/patch bumps into a single weekly PR instead of one-per-dependency, so the
    # PR queue stays small. Major bumps still arrive as their own PRs for individual review.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Keep @types/node aligned with the pinned runtime (Node 24, see .node-version). A major bump
      # ahead of the runtime lets code typecheck against APIs that don't exist at run time; allow
      # only minor/patch within the current major and revisit this when the Node pin moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @noble/{hashes,curves,ciphers} 2.x require Node 20.19+ and are ESM-only; the embedded Android host
      # runs Node 18, so the major is blocked until that runtime moves (Sol crypto review; docs/23 §11).
      # It also needs a coordinated, security-reviewed migration of @loam/crypto — not an auto-bump. Hold at
      # 1.x (minor/patch within 1.x is fine); revisit when the embedded runtime moves off Node 18.
      - dependency-name: "@noble/hashes"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@noble/curves"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@noble/ciphers"
        update-types: ["version-update:semver-major"]
